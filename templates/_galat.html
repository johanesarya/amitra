{% comment %}Isi halaman galat. Parameter: kode, judul, isi (blok), ikon.{% endcomment %}
<div class="mx-auto max-w-2xl py-10 text-center">
  <span class="mx-auto flex size-16 items-center justify-center rounded-2xl border border-slate-200 bg-white text-primer-700 shadow-sm">{% include "_ikon.html" with n=ikon k="size-8" %}</span>
  <p class="mt-6 text-7xl font-extrabold tracking-tight text-primer-700 sm:text-8xl">{{ kode }}</p>
  <h1 class="mt-4 text-2xl font-bold text-slate-900 sm:text-3xl">{{ judul }}</h1>
</div>
