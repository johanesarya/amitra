{% comment %}Indikator autosave dan penanganan konflik untuk komponen SIAMI.autosave.{% endcomment %}
<p class="mt-1 text-xs" aria-live="polite">
  <span x-show="status === 'tersimpan' && waktu" class="text-green-700">Tersimpan pukul <span x-text="waktu"></span></span>
  <span x-show="status === 'belum'" class="text-slate-500">Ada perubahan yang belum tersimpan</span>
  <span x-show="status === 'menyimpan'" class="text-slate-500">Menyimpan…</span>
  <span x-show="status === 'gagal'" class="text-red-700" x-text="pesan"></span>
</p>
<div x-show="status === 'konflik'" x-cloak class="kotak-peringatan mt-2 space-y-2" role="alert">
  <p>Butir ini sudah diubah di tab atau perangkat lain pukul <span x-text="konflik.waktu"></span>. Isian Anda belum disimpan.</p>
  <div class="flex flex-wrap gap-2">
    <button type="button" class="tombol-kedua" @click="pakaiVersiServer()">Muat isian terbaru</button>
    <button type="button" class="tombol-kedua" @click="timpa()">Simpan isian saya</button>
  </div>
</div>
