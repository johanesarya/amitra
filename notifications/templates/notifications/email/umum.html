<!doctype html>
<html lang="id">
<body style="margin:0;padding:24px;background:#f8fafc;font-family:Arial,Helvetica,sans-serif;color:#0f172a">
  <table role="presentation" style="max-width:560px;margin:0 auto;background:#ffffff;border:1px solid #e2e8f0;border-radius:8px">
    <tr><td style="padding:24px">
      <p style="margin:0 0 4px;font-size:13px;color:#475569">AMITRA · Lembaga Penjaminan Mutu</p>
      <h1 style="margin:0 0 16px;font-size:18px">{{ judul }}</h1>
      <p style="margin:0 0 12px;font-size:14px">Yth. {{ pengguna.get_full_name }},</p>
      {% if pesan %}<p style="margin:0 0 16px;font-size:14px;white-space:pre-line">{{ pesan }}</p>{% endif %}
      {% if tautan %}<p style="margin:0 0 16px"><a href="{{ tautan }}" style="display:inline-block;background:#1d4ed8;color:#ffffff;text-decoration:none;padding:10px 16px;border-radius:6px;font-size:14px;font-weight:bold">Buka AMITRA</a></p>{% endif %}
      <p style="margin:16px 0 0;font-size:12px;color:#64748b">Email ini dikirim otomatis; mohon tidak membalas.</p>
    </td></tr>
  </table>
</body>
</html>
